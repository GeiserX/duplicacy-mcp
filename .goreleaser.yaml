project_name: duplicacy-mcp
release:
  github:
    owner: GeiserX
    name: duplicacy-mcp
  draft: false
  prerelease: auto # tag "v0.3.0-rc1" becomes pre-release

builds:
  - id: bin
    main: ./cmd/server
    # Static, with no libc dependency. Go turns cgo on for a native build when
    # a C compiler is present, so on the amd64 runner the linux binary linked
    # glibc and would not start on Alpine or NixOS; arm64 was static only
    # because it is cross-compiled.
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/geiserx/duplicacy-mcp/version.Version={{ .Version }}
      - -X github.com/geiserx/duplicacy-mcp/version.Commit={{ .ShortCommit }}
      - -X github.com/geiserx/duplicacy-mcp/version.Date={{ .Date }}

# Signs the darwin binaries with a Developer ID certificate and notarizes them
# with Apple, from Linux, before they are archived. Skipped when the secrets
# are absent (pull requests, snapshots); release.yml fails a tag build that
# lacks any of them, so a release is never shipped unsigned by accident.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [bin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: dist
    builds: [bin]
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

dockers:
  # ------------- amd64 -------------
  - image_templates:
      - "drumsergio/duplicacy-mcp:{{ .Tag }}-amd64"
      - "drumsergio/duplicacy-mcp:latest-amd64"
    dockerfile: Dockerfile
    goos:   linux
    goarch: amd64
    use:    buildx
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
      - client/
      - config/
      - version/
      - .goreleaser.yaml
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .ShortCommit }}"
      - "--build-arg=DATE={{ .Date }}"
  # ------------- arm64 -------------
  - image_templates:
      - "drumsergio/duplicacy-mcp:{{ .Tag }}-arm64"
      - "drumsergio/duplicacy-mcp:latest-arm64"
    dockerfile: Dockerfile
    goos:   linux
    goarch: arm64
    use:    buildx
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
      - client/
      - config/
      - version/
      - .goreleaser.yaml
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .ShortCommit }}"
      - "--build-arg=DATE={{ .Date }}"

docker_manifests:
  # stitch the per-arch images into a combined tag = multi-arch
  - name_template: 'drumsergio/duplicacy-mcp:{{ .Tag }}'
    image_templates:
      - 'drumsergio/duplicacy-mcp:{{ .Tag }}-amd64'
      - 'drumsergio/duplicacy-mcp:{{ .Tag }}-arm64'
  - name_template: 'drumsergio/duplicacy-mcp:latest'
    image_templates:
      - 'drumsergio/duplicacy-mcp:latest-amd64'
      - 'drumsergio/duplicacy-mcp:latest-arm64'

snapshot:
  name_template: "snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat'
      order: 0
    - title: "Fixes"
      regexp: '^fix'
      order: 1
    # No regexp: everything else (chore, ci, docs, build), so the release
    # notes are never empty.
    - title: "Other changes"
      order: 999
