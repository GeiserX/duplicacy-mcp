version: 2
updates:
  # Majors are not ignored: an SDK major such as mcp-go v1 (MCP 2026-07-28)
  # must arrive as its own pull request instead of never.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # Keeps the digest-pinned base images in the Dockerfile current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Keeps the SHA-pinned actions current; the version comment is updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
